<head>
<meta charset="utf-8">

<title>囲炉裏の城下町｜MORINOA（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&family=Barlow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F2EEE0;--ink:#111D0F;--forest:#254723;--avocado:#8AB657;--shu:#8C4229;--ukon:#E9B53A;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#120b07;color:var(--cream);font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#gl.grab{cursor:grabbing}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(255,140,50,.10),transparent 45%),radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(8,4,2,.62) 100%)}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 20px 0;pointer-events:none}
.top a,.top button{pointer-events:auto}
.logo{display:flex;align-items:center;gap:10px;color:var(--cream);text-decoration:none;font:700 15px 'Barlow',sans-serif;letter-spacing:.2em}
.logo img{width:40px;height:40px}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;background:rgba(242,238,224,.94);color:var(--ink);font:900 13px 'Zen Maru Gothic',sans-serif;letter-spacing:.08em;text-decoration:none}
#title{position:fixed;inset:0;z-index:4;display:grid;place-content:center;text-align:center;pointer-events:none;transition:opacity 1.2s ease .2s}
#title h1{font:800 clamp(34px,6vw,76px)/1.15 'Shippori Mincho',serif;letter-spacing:.14em;text-shadow:0 2px 24px rgba(0,0,0,.6)}
#title p{margin-top:14px;font:700 13px 'Barlow',sans-serif;letter-spacing:.4em;opacity:.8}
#title.out{opacity:0}
#marks{position:fixed;inset:0;z-index:3;pointer-events:none}
.mark{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:6px;margin:-34px 0 0 -14px;background:none;border:0;cursor:pointer;color:var(--cream);opacity:0;transition:opacity .5s ease;will-change:transform}
.mark i{display:block;width:28px;height:28px;border-radius:50%;background:var(--cream);box-shadow:0 0 0 5px rgba(242,238,224,.28),0 0 22px rgba(255,170,70,.9);animation:pulse 2.2s ease-in-out infinite}
.mark i::after{content:"";display:block;width:10px;height:10px;margin:9px;border-radius:50%;background:var(--shu)}
.mark span{padding:3px 10px;border-radius:999px;background:rgba(17,29,15,.82);font:900 12px 'Zen Maru Gothic',sans-serif;letter-spacing:.1em;white-space:nowrap}
.mark.on i{background:var(--ukon)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#cards{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:14px;overflow-x:auto;padding:0 20px calc(18px + env(safe-area-inset-bottom));scroll-snap-type:x proximity;scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
.card{flex:0 0 min(320px,78vw);scroll-snap-align:center;padding:18px 20px 16px;border-radius:14px;background:rgba(242,238,224,.95);color:var(--ink);cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card.on{transform:translateY(-8px);box-shadow:0 14px 32px rgba(0,0,0,.45),0 0 0 3px var(--ukon)}
.card h3{font:800 19px 'Shippori Mincho',serif;letter-spacing:.06em}
.card .en{margin-top:2px;font:700 11px 'Barlow',sans-serif;letter-spacing:.2em;color:#5B5344}
.card p:not(.en){margin-top:8px;font-size:13px;line-height:1.7;color:#3b3328}
.soon{display:inline-block;margin-top:10px;font:700 11px 'Barlow',sans-serif;letter-spacing:.24em;color:#8C4229}
.more{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:36px;padding:0 16px;border-radius:999px;background:var(--forest);color:var(--cream);font:900 13px 'Barlow',sans-serif;text-decoration:none}
#reset{position:fixed;right:20px;bottom:calc(168px + env(safe-area-inset-bottom));z-index:5;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:rgba(17,29,15,.78);color:var(--cream);font:900 12px 'Zen Maru Gothic',sans-serif;letter-spacing:.1em;cursor:pointer}
.fadeov{position:fixed;inset:0;z-index:9;background:#120b07;pointer-events:none;opacity:0}
body.enter .fadeov{animation:fadein 1.6s ease both}
@keyframes fadein{from{opacity:1}to{opacity:0}}
#marks,#cards,#reset,.hint{display:none !important}
.act{position:fixed;z-index:6;min-height:48px;padding:0 26px;border:2px solid rgba(242,238,224,.7);border-radius:999px;background:rgba(17,10,5,.62);color:#F2EEE0;font:900 14px 'Zen Maru Gothic',sans-serif;letter-spacing:.16em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;backdrop-filter:blur(6px)}
#back2{top:calc(16px + env(safe-area-inset-top));right:20px}
#peek{left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%)}
.hint{position:fixed;left:20px;bottom:calc(176px + env(safe-area-inset-bottom));z-index:4;font:700 11px 'Barlow',sans-serif;letter-spacing:.22em;opacity:.6;pointer-events:none}
@media(max-width:700px){
  .hint{display:none}
  #cards{gap:10px;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
  .card{flex:0 0 min(236px,66vw);padding:10px 12px;border-radius:12px}
  .card h3{font-size:15px;letter-spacing:.04em}
  .card .en{margin-top:1px;font-size:9.5px;letter-spacing:.16em}
  .card p:not(.en){margin-top:5px;font-size:11.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .more{margin-top:6px;min-height:30px;padding:0 12px;font-size:11.5px}
  #reset{right:12px;bottom:calc(142px + env(safe-area-inset-bottom));min-height:34px;padding:0 12px;font-size:11px}
}
#hot{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
.hot{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;cursor:pointer;margin:-9px 0 0 -9px;width:18px;height:18px;color:#F2EEE0}
.hot i{display:block;width:8px;height:8px;margin:5px;border-radius:50%;background:rgba(242,238,224,.55);box-shadow:0 0 0 2px rgba(242,238,224,.14);transition:.2s}
.hot:hover i,.hot:focus-visible i{background:#F2EEE0;box-shadow:0 0 0 4px rgba(242,238,224,.3)}
.hot span{position:absolute;left:22px;top:-2px;padding:3px 10px;border-radius:999px;background:rgba(17,29,15,.85);font:900 12px 'Zen Maru Gothic',sans-serif;letter-spacing:.1em;white-space:nowrap;opacity:0;transform:translateX(-4px);transition:.2s;pointer-events:none}
.hot:hover span,.hot:focus-visible span{opacity:1;transform:none}
#roomcard{position:fixed;left:24px;bottom:24px;z-index:7;width:min(360px,80vw);padding:20px 22px 18px;border-radius:14px;background:rgba(242,238,224,.96);color:#111D0F;box-shadow:0 12px 36px rgba(0,0,0,.45);opacity:0;transform:translateY(12px);pointer-events:none;transition:.3s}
#roomcard.on{opacity:1;transform:none;pointer-events:auto}
#roomcard .x{position:absolute;right:10px;top:8px;width:32px;height:32px;border:0;background:none;font-size:22px;cursor:pointer;color:#5B5344}
#roomcard .k{font:700 11px 'Barlow',sans-serif;letter-spacing:.24em;color:#8C4229}
#roomcard h3{margin-top:4px;font:800 21px 'Shippori Mincho',serif;letter-spacing:.06em}
#roomcard .b{margin-top:8px;font-size:13.5px;line-height:1.8;color:#3b3328}
#roomcard .more{display:inline-flex;align-items:center;gap:6px;margin-top:12px;min-height:38px;padding:0 18px;border-radius:999px;background:#254723;color:#F2EEE0;font:900 13px 'Barlow',sans-serif;text-decoration:none}
@media(prefers-reduced-motion:reduce){.mark i{animation:none}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="top">
  <a class="logo" href="index.html" aria-label="MORINOA トップへ"><img src="kamon-cream.png" alt="" width="480" height="468">MORINOA</a>
  
</div>
<div class="vig"></div>
<div class="fadeov"></div>
<div id="title"><div><h1>囲炉裏の城下町</h1><p>MORINOA ／ A TOWN IN THE HEARTH</p></div></div>
<div id="marks"></div>
<p class="hint">DRAG ／ PINCH ／ SCROLL</p>
<button id="reset" type="button" style="display:none">全体を見る</button>
<div id="cards" aria-label="見どころ"></div>
<a class="act" id="back2" href="index.html">戻る</a>
<button class="act" id="peek" type="button" style="display:none">覗く</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/irori-rooms.js?v=1"></script>
<script src="js/irori.js?v=49"></script>
</body>
</html>
