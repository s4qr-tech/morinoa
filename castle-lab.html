<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<script>/* PC専用：スマホ・タブレットはトップへ */(function(){var m=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&matchMedia("(pointer:coarse)").matches)||innerWidth<820;if(m)location.replace("index.html");})();</script>

<title>城の作り込み｜MORINOA（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Maru+Gothic:wght@500;700;900&family=Barlow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#F2EEE0;--ink:#111D0F;--forest:#254723;--avocado:#8AB657;--shu:#8C4229;--ukon:#E9B53A;--bp:#8ec8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#06122a;color:var(--cream);font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.grid{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s;background-image:linear-gradient(rgba(142,200,255,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(142,200,255,.12) 1px,transparent 1px);background-size:48px 48px}
body.bp .grid{opacity:1}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(2,6,16,.6) 100%)}
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top)) 22px 0;pointer-events:none}
.top>*{pointer-events:auto}
h1{font:800 clamp(18px,2.4vw,28px)/1.3 'Shippori Mincho',serif;letter-spacing:.14em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
h1 small{display:block;margin-top:4px;font:700 11px 'Barlow',sans-serif;letter-spacing:.32em;opacity:.7}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
button,.lnk{min-height:44px;padding:0 16px;border:1.5px solid rgba(242,238,224,.5);border-radius:999px;background:rgba(6,18,42,.62);color:var(--cream);font:900 12px 'Zen Maru Gothic',sans-serif;letter-spacing:.1em;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;backdrop-filter:blur(6px)}
button.on{background:var(--cream);color:var(--ink)}
#bp.on{background:var(--bp);border-color:var(--bp);color:#06122a}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:0 22px calc(18px + env(safe-area-inset-bottom));pointer-events:none}
.bottom>*{pointer-events:auto}
#notes{position:fixed;inset:0;z-index:3;pointer-events:none}
.note{position:absolute;left:0;top:0;display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .4s;white-space:nowrap;font:700 12px 'Zen Maru Gothic',sans-serif;letter-spacing:.08em;color:var(--bp)}
.note i{display:block;width:44px;height:1px;background:var(--bp)} .note i::before{content:"";display:block;width:7px;height:7px;margin:-3px 0 0 -3px;border:1px solid var(--bp);border-radius:50%;background:#06122a}
.note span{padding:2px 8px;border:1px solid rgba(142,200,255,.6);background:rgba(6,18,42,.7)}
#under-view{position:fixed;inset:0;z-index:4;display:grid;place-items:center;text-align:center;background:#000;opacity:0;pointer-events:none;transition:opacity .9s ease}
body.under #under-view{opacity:1;pointer-events:auto}
#under-view .eyebrow{font:700 12px 'Barlow',sans-serif;letter-spacing:.4em;opacity:.55}
#under-view h2{margin-top:14px;font:800 clamp(30px,6vw,64px)/1.1 'Barlow',sans-serif;letter-spacing:.18em;color:#F2EEE0;text-shadow:0 0 28px rgba(255,170,70,.35)}
#under-view .sub{margin-top:18px;font:500 14px/2 'Shippori Mincho',serif;letter-spacing:.12em;opacity:.8}
#under-view button{margin-top:26px}
body.under .top,body.under .bottom,body.under .fadeov{position:fixed;inset:0;z-index:9;background:#120b07;opacity:0;pointer-events:none;transition:opacity .9s ease}
body.fade .fadeov{opacity:1}
body.fade-in .fadeov{opacity:0;animation:fadein 1.4s ease both}
@keyframes fadein{from{opacity:1}to{opacity:0}}
.hint{z-index:5}
.hint{position:fixed;left:22px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:4;font:700 11px 'Barlow',sans-serif;letter-spacing:.22em;opacity:.55;pointer-events:none}
@media(max-width:700px){.hint{display:none}h1{font-size:16px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="grid"></div><div class="vig"></div>
<div class="top">
  <h1>城の作り込み<small>CASTLE STUDY ／ 試作</small></h1>
  <div class="btns"><button id="cut" type="button">断面にする</button><a class="lnk" id="goIrori" href="irori.html?enter=1">囲炉裏へ戻る</a></div>
</div>
<div id="notes"></div>
<div class="fadeov"></div>
<div id="under-view"><div><p class="eyebrow">B1 ／ UNDERGROUND</p><h2>COMING SOON</h2><p class="sub">地下はいま、暗闇の中。<br>これからの活動を、ここに積み上げていきます。</p><button id="under-back" type="button">天守へ戻る</button></div></div>
<p class="hint">DRAG ／ PINCH ／ SCROLL</p>
<div class="bottom">
  <button data-go="all" type="button" class="on">全景</button>
  <button data-go="donjon" type="button">天守に寄る</button>
  <button data-go="garden" type="button">庭</button>
  <button id="under" type="button">地下 ｜ COMING SOON</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/castle.js?v=50"></script>
</body>
</html>
