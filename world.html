<style>
:root{--bg:#e9cf7e;--brown:#3b2a1e;--gold:#e8a02e;--ink:#4a3a2a;--cardW:min(620px,86vw);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;}
#gl,#trail{position:fixed;inset:0;width:100%;height:100%;display:block;}
#trail{pointer-events:none;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}

/* 画面左上ロゴ・右上MENU */
.logo{position:fixed;left:clamp(16px,3vw,40px);top:clamp(14px,3vw,34px);z-index:5;display:flex;align-items:center;gap:12px;}
.logo img{width:clamp(40px,4.2vw,54px);height:auto;border-radius:12px;background:#3b2a1e;padding:4px;}
.logo b{display:block;font:800 clamp(17px,1.6vw,22px)/1 'Montserrat',sans-serif;letter-spacing:.06em;color:#fff;text-shadow:0 2px 0 rgba(120,80,20,.25);}
.logo small{display:block;margin-top:4px;font-weight:800;font-size:11px;letter-spacing:.12em;color:#fff;opacity:.9;}
.menubtn{position:fixed;right:clamp(14px,3vw,40px);top:clamp(12px,2.6vw,32px);z-index:6;display:flex;align-items:center;gap:12px;padding:0 clamp(22px,2.4vw,34px);height:clamp(52px,5vw,66px);border-radius:999px;background:#fff;font:900 clamp(15px,1.5vw,20px)/1 'Montserrat',sans-serif;letter-spacing:.05em;color:var(--brown);box-shadow:0 4px 0 rgba(150,100,20,.18);}
.menubtn i{display:block;width:22px;height:12px;border-top:3px solid var(--brown);border-bottom:3px solid var(--brown);}
.menubtn i::after{content:"";display:block;width:14px;border-top:3px solid var(--brown);margin:3px 0 0;}

/* 左下のバナー */
.banner{position:fixed;left:clamp(16px,3vw,40px);bottom:24px;z-index:5;display:block;padding:clamp(14px,1.6vw,20px) clamp(22px,2.4vw,32px);border-radius:20px;background:var(--brown);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .2s;}
.banner:hover{transform:translateY(-3px);}
.banner b{display:block;font-weight:900;font-size:clamp(17px,1.8vw,24px);letter-spacing:.04em;}
.banner b::after{content:"▶";margin-left:10px;font-size:.8em;}
.banner small{display:block;margin-top:6px;font-weight:800;font-size:clamp(10px,.9vw,12px);letter-spacing:.2em;opacity:.9;}

/* 下のカード */
.pin{position:fixed;left:0;top:0;z-index:4;pointer-events:none;will-change:transform;transition:opacity .3s;}
.pin.open{z-index:6;}
.pin-btn{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;pointer-events:auto;background:var(--brown);color:#fff;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.18);font:900 17px/1 'M PLUS Rounded 1c',sans-serif;transition:transform .2s,background .2s;}
.pin-btn::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid rgba(255,255,255,.8);animation:ring 2.2s ease-out infinite;pointer-events:none;}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.pin-btn:hover,.pin.open .pin-btn{transform:scale(1.12);background:var(--gold);}
.pin.open .pin-btn::before{animation:none;opacity:0;}
.pin-card{display:none;position:absolute;left:0;bottom:30px;transform:translateX(calc(-50% + var(--dx,0px)));width:min(236px,74vw);padding:12px 16px 14px;border-radius:18px;background:#fff;box-shadow:0 5px 0 rgba(150,100,20,.18);pointer-events:auto;}
.pin.open .pin-card{display:block;animation:pop .22s ease-out;}
@keyframes pop{from{opacity:0;margin-bottom:-8px}to{opacity:1;margin-bottom:0}}
.pin.below .pin-card{bottom:auto;top:30px;}
.pin-card::after{content:"";position:absolute;left:calc(50% - var(--dx,0px));bottom:-10px;width:3px;height:10px;margin-left:-1.5px;background:var(--brown);}
.pin.below .pin-card::after{bottom:auto;top:-10px;}
.pin-card h2{font-weight:900;font-size:17px;line-height:1.2;color:var(--gold);letter-spacing:.03em;}
.pin-card .en{display:block;margin-top:3px;font:800 10px/1 'Montserrat',sans-serif;letter-spacing:.06em;color:#9a8f82;}
.pin-card p{margin-top:8px;font-weight:800;font-size:12px;line-height:1.7;color:var(--ink);}
.pin-card .more{display:inline-flex;align-items:center;gap:8px;margin-top:10px;height:34px;padding:0 15px;border-radius:999px;background:var(--gold);color:#fff;font:800 13px/1 'Montserrat',sans-serif;}
.pin-card .more::after{content:"";width:7px;height:7px;border-top:2.5px solid #fff;border-right:2.5px solid #fff;transform:rotate(45deg);}

.hintdrag{position:fixed;right:clamp(16px,3vw,40px);bottom:24px;z-index:5;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.88);font-weight:800;font-size:13px;letter-spacing:.08em;color:var(--brown);transition:opacity .6s;pointer-events:none;}

/* 詳細 */
.sheet{position:fixed;inset:0;z-index:18;display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,48px);background:rgba(59,42,30,.45);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;}
.sheet.open{opacity:1;visibility:visible;}
.sheet .in{position:relative;width:min(880px,100%);max-height:100%;overflow:auto;padding:clamp(28px,4vw,52px);border-radius:32px;background:#fff;box-shadow:0 10px 0 rgba(150,100,20,.2);transform:translateY(16px);transition:transform .35s;}
.sheet.open .in{transform:none;}
.sheet h3{font-weight:900;font-size:clamp(28px,3.6vw,46px);color:var(--gold);}
.sheet .en{display:block;margin:6px 0 18px;font:800 14px/1 'Montserrat',sans-serif;letter-spacing:.08em;color:#9a8f82;}
.sheet .lead{font-weight:800;font-size:clamp(15px,1.5vw,18px);line-height:1.9;}
.sheet ol{list-style:none;margin-top:20px;display:grid;gap:12px;}
.sheet li{padding:16px 20px;border-radius:18px;background:#fbf3df;}
.sheet li b{display:block;font-weight:900;font-size:clamp(16px,1.6vw,20px);color:var(--brown);}
.sheet li b i{margin-right:10px;font:800 14px/1 'Montserrat',sans-serif;color:var(--gold);font-style:normal;}
.sheet li span{display:block;margin-top:6px;font-weight:500;font-size:clamp(13px,1.3vw,16px);line-height:1.8;}
.sheet .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;}
.pill{display:inline-flex;align-items:center;gap:10px;padding:0 26px;height:54px;border-radius:999px;background:var(--gold);color:#fff;font-weight:900;font-size:16px;}
.pill.dark{background:var(--brown);}
.sheet .close{width:48px;height:48px;font-size:20px;background:#fbf3df;top:18px;right:18px;}

/* 読み込み */
.load{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);color:#fff;font:900 18px/1 'Montserrat',sans-serif;letter-spacing:.2em;transition:opacity .6s,visibility .6s;}
.load.off{opacity:0;visibility:hidden;}
.load img{width:72px;border-radius:16px;background:#3b2a1e;padding:6px;animation:bob 1.2s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(-8px);}}

}

}
function studio(cx, cz){
  var i, j, k, x0 = cx - 6, z0 = cz - 4;

function torii(cx, cz){
  box(cx - 5, 1, cz, 2, 10, 2, RED); box(cx + 4, 1, cz, 2, 10, 2, RED);
  box(cx - 7, 11, cz - 1, 15, 1, 4, 0x2f2f33); box(cx - 6, 10, cz, 13, 1, 2, RED); box(cx - 4, 8, cz, 9, 1, 2, RED);
  [-10, 11].forEach(function(dx){ box(cx + dx, 1, cz, 1, 12, 1, WOOD); box(cx + dx - (dx < 0 ? 0 : 1), 4, cz, 2, 7, 1, PINK); });

function lantern(x, z){ box(x, 1, z, 1, 3, 1, 0x9a927c); box(x, 4, z, 1, 1, 1, 0xf3dc9a); box(x - 1, 5, z - 1, 3, 1, 3, 0x6f6a5a); }
function town(){
  ground();
  castle(31, 16); pagoda(11, 12); samurai(52, 13); torii(32, 54);
  [5, 15, 25].forEach(function(x, i){ nagaya(x, 30, 9, [0xf6dfc0, 0xf7d3cf, 0xdcebf0][i], [BLUE, PINK, YEL][i]); });
  [37, 46, 55].forEach(function(x, i){ shop(x, 30, 8, [BLUE, PINK, GREEN][i], [0x6b5240, 0x6b5240, 0x6b5240][i]); });
  [[3, 24, 'sakura'], [20, 26, 'sakura'], [60, 24, 'sakura'], [44, 26, 'maple'], [4, 44, 'green'], [18, 50, 'sakura'], [22, 58, 'green'], [44, 48, 'sakura'], [52, 44, 'maple'], [58, 56, 'sakura'], [44, 58, 'green'], [3, 5, 'green'], [22, 6, 'maple'], [61, 4, 'sakura'], [38, 8, 'green'], [60, 40, 'green']].forEach(function(t){ tree(t[0], t[1], t[2]); });
  [[28, 24], [35, 24], [28, 44], [35, 44], [28, 58], [35, 58]].forEach(function(l){ lantern(l[0], l[1]); });
}

/* ---------- 描画 ---------- */
var canvas = document.getElementById('gl');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); renderer.setClearColor(0xe9cf7e);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(34, 1, 1, 400);
scene.add(new THREE.HemisphereLight(0xfff4de, 0xcfa86a, .95));
var sun = new THREE.DirectionalLight(0xffffff, .75); sun.position.set(-30, 60, 40); scene.add(sun);

town();
var cells = Array.from(vm.values()).filter(function(v){
  var x = v[0], y = v[1], z = v[2];
  return !(vm.has(key(x + 1, y, z)) && vm.has(key(x - 1, y, z)) && vm.has(key(x, y + 1, z)) && vm.has(key(x, y - 1, z)) && vm.has(key(x, y, z + 1)) && vm.has(key(x, y, z - 1)));
});
var geo = new THREE.BoxGeometry(1, 1, 1), mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
var mesh = new THREE.InstancedMesh(geo, mat, cells.length), m4 = new THREE.Matrix4(), col = new THREE.Color();
cells.forEach(function(v, i){
  m4.setPosition(v[0] - 32, v[1], v[2] - 32); mesh.setMatrixAt(i, m4);
  col.setHex(v[3]); col.multiplyScalar(.95 + R(i * .37) * .1); mesh.setColorAt(i, col);
});
mesh.instanceMatrix.needsUpdate = true; mesh.instanceColor.needsUpdate = true; scene.add(mesh);

/* 歩く人（3つのボクセルで一人） */
var PEOPLE = [], PN = 14, pm = new THREE.InstancedMesh(geo, mat, PN * 3);
var SHIRT = [0xf29bb0, 0x4a90b8, 0xe8b03c, 0x7cc04b, 0xd8453a, 0xffffff];
for (var pi = 0; pi < PN; pi++) {
  var hz = pi % 2 === 0;
  PEOPLE.push({ h: hz, t: R(pi * 3.3) * 50, v: (.6 + R(pi) * .8) * (R(pi * 9) > .5 ? 1 : -1), lane: hz ? 38.6 + R(pi * 5) * 2.8 : 30.6 + R(pi * 5) * 2.8 });
  [0, 1, 2].forEach(function(k){ col.setHex(k === 0 ? 0x4a3426 : k === 1 ? SHIRT[pi % 6] : 0xf1c9a0); pm.setColorAt(pi * 3 + k, col); });
}
scene.add(pm);
function placePeople(dt){
  var o = new THREE.Matrix4(), s = new THREE.Matrix4().makeScale(.8, .8, .8);
  PEOPLE.forEach(function(p, i){
    p.t += p.v * dt; var span = p.h ? 56 : 34, u = ((p.t % (span * 2)) + span * 2) % (span * 2); u = u > span ? span * 2 - u : u;
    var x = p.h ? 3 + u : p.lane, z = p.h ? p.lane : 28 + u, bob = Math.abs(Math.sin(p.t * 6)) * .15;
    [[0, 1.0], [1, 1.8], [2, 2.55]].forEach(function(a){ o.makeTranslation(x - 32, a[1] * .8 + .5 + bob * (a[0] ? 1 : 0), z - 32); o.multiply(s); pm.setMatrixAt(i * 3 + a[0], o); });
  });
  pm.instanceMatrix.needsUpdate = true; pm.instanceColor.needsUpdate = true;
}

/* 桜の花びら */
var PN2 = 160, pg = new THREE.BufferGeometry(), pp = new Float32Array(PN2 * 3), pv = [];
for (var q = 0; q < PN2; q++) { pp[q * 3] = (R(q) - .5) * 90; pp[q * 3 + 1] = R(q * 3) * 50; pp[q * 3 + 2] = (R(q * 7) - .5) * 90; pv.push(2 + R(q * 5) * 3); }
pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
var petals = new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xf8b6c8, size: .9, sizeAttenuation: true })); scene.add(petals);
function fall(dt, t){ for (var i = 0; i < PN2; i++) { pp[i * 3 + 1] -= pv[i] * dt; pp[i * 3] += Math.sin(t + i) * dt * 1.2; if (pp[i * 3 + 1] < 0) pp[i * 3 + 1] = 50; } pg.attributes.position.needsUpdate = true; }

/* ---------- カメラ移動とカード ---------- */
setTimeout(function(){ var h = document.getElementById('hintdrag'); if (h) h.classList.add('off'); }, 7000);
var cur = { x: 32, y: 6, z: 30, az: -.3, d: 120 }, goal = { x: 32, y: 6, z: 30, az: -.3, d: 100 }, active = 0, mouseX = 0, pinEls = [];
CARDS.forEach(function(c, i){
  var pin = document.createElement('div'); pin.className = 'pin'; pin.style.opacity = 0;
  pin.innerHTML = '<button class="pin-btn" type="button" aria-label="' + c.t + '">' + c.t.charAt(0) + '</button><div class="pin-card"><h2>' + c.t + '</h2><span class="en">' + c.en + '</span><p>' + c.p + '</p><button class="more" type="button">More</button></div>';
  [pin.querySelector('.pin-btn'), pin.querySelector('.pin-card')].forEach(function(node){ node.addEventListener('click', function(e){
    e.stopPropagation(); if (e.target.closest('.more')) { openSheet(i); return; }
    var was = pin.classList.contains('open'); closeCards(); if (!was) { pin.classList.add('open'); active = i; }
  }); });
  document.body.appendChild(pin); pinEls.push(pin);
});
function closeCards(){ pinEls.forEach(function(p){ p.classList.remove('open'); }); }

document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeAll(); });
window.addEventListener('mousemove', function(e){ mouseX = e.clientX / window.innerWidth - .5; });
/* 指・カーソルで町を回す（ドラッグで回転、上下で角度、ホイールとピンチで寄り引き） */
var uAz = 0, uEl = 0, uZ = 1, drag = null, pts = {}, pinch = 0, glc = document.getElementById('gl');
glc.style.cursor = 'grab'; glc.style.touchAction = 'none';
glc.addEventListener('pointerdown', function(e){ glc.setPointerCapture(e.pointerId); pts[e.pointerId] = [e.clientX, e.clientY]; drag = [e.clientX, e.clientY]; glc.style.cursor = 'grabbing'; pinch = 0; });
glc.addEventListener('pointermove', function(e){
  if (!pts[e.pointerId]) return; pts[e.pointerId] = [e.clientX, e.clientY]; var ids = Object.keys(pts);
  if (ids.length >= 2) { var a = pts[ids[0]], b = pts[ids[1]], dd = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) uZ = Math.max(.55, Math.min(1.5, uZ * pinch / dd)); pinch = dd; return; }
  if (drag) { uAz -= (e.clientX - drag[0]) * .006;  drag = [e.clientX, e.clientY]; }
});
var downAt = null;
glc.addEventListener('pointerdown', function(e){ downAt = [e.clientX, e.clientY]; });
glc.addEventListener('pointerup', function(e){ if (downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) < 5) closeCards(); });
function endDrag(e){ delete pts[e.pointerId]; if (!Object.keys(pts).length) { drag = null; glc.style.cursor = 'grab'; } pinch = 0; }
glc.addEventListener('pointerup', endDrag); glc.addEventListener('pointercancel', endDrag);
glc.addEventListener('wheel', function(e){ e.preventDefault(); uZ = Math.max(.55, Math.min(1.5, uZ * (1 + e.deltaY * .001))); }, { passive: false });

/* MENU・詳細 */
var menu = document.getElementById('menu'), sheet = document.getElementById('sheet'), sheetIn = document.getElementById('sheetIn');
document.getElementById('menuBtn').addEventListener('click', function(){ menu.classList.add('open'); });
document.getElementById('menuClose').addEventListener('click', closeAll);
sheet.addEventListener('click', function(e){ if (e.target === sheet) closeAll(); });
function closeAll(){ menu.classList.remove('open'); sheet.classList.remove('open'); }
function openSheet(i){
  var c = CARDS[i], h = '<button class="close" type="button" aria-label="閉じる">✕</button><h3>' + c.t + '</h3><span class="en">' + c.en + '</span><p class="lead">' + c.lead + '</p>';
  if (c.list) h += '<ol>' + c.list.map(function(l){ return '<li><b><i>' + l[0] + '</i>' + l[1] + '</b><span>' + l[2] + '</span></li>'; }).join('') + '</ol>';
  var btns = c.btns || [['軍議を申し込む →', FORM, 0]];
  h += '<div class="btns">' + btns.map(function(b){ return '<a class="pill' + (b[2] ? ' dark' : '') + '" href="' + b[1] + '"' + (b[1].indexOf('http') === 0 ? ' target="_blank" rel="noopener"' : '') + '>' + b[0] + '</a>'; }).join('') + '</div>';
  sheetIn.innerHTML = h; sheetIn.querySelector('.close').addEventListener('click', closeAll); sheet.classList.add('open');
}

function size(){
  var W = window.innerWidth, H = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix();
}
window.addEventListener('resize', size); size();

var last = performance.now() / 1000, T0 = last, shown = false;
function frame(){
  requestAnimationFrame(frame);
  var now = performance.now() / 1000, dt = Math.min(.05, now - last), t = now - T0; last = now;
  var k = 1 - Math.exp(-dt * 2.6);
  cur.x += (goal.x - cur.x) * k; cur.y += (goal.y - cur.y) * k; cur.z += (goal.z - cur.z) * k; cur.az += (goal.az - cur.az) * k; cur.d += (goal.d - cur.d) * k;
  var az = cur.az + uAz + mouseX * .12 + Math.sin(t * .2) * .03, el = .4, d = cur.d * uZ, hcos = Math.cos(el) * d;
  var aspectBoost = Math.max(1, 1.25 / camera.aspect);                       // 縦長の画面では引く
  d *= aspectBoost; hcos = Math.cos(el) * d;
  var tx = cur.x - 32, ty = cur.y - d * .08, tz = cur.z - 32;
  camera.position.set(tx + Math.sin(az) * hcos, ty + Math.sin(el) * d + d * .08, tz + Math.cos(az) * hcos);
  camera.lookAt(tx, ty, tz);
  placePeople(dt); fall(dt, t);
  renderer.render(scene, camera);
  var W = window.innerWidth, Hh = window.innerHeight, pv3 = new THREE.Vector3();
  pinEls.forEach(function(pe, i){
    var pn = CARDS[i].pin; pv3.set(pn.x - 32, pn.y, pn.z - 32).project(camera);
    var px = (pv3.x * .5 + .5) * W, py = (-pv3.y * .5 + .5) * Hh, card = pe.querySelector('.pin-card'), w = card.offsetWidth, h = card.offsetHeight, dx = 0;
    if (pv3.z > 1) { pe.style.opacity = 0; pe.style.pointerEvents = 'none'; return; }
    pe.classList.toggle('below', py - 30 - h < 76); dx = Math.max(12, Math.min(W - w - 12, px - w / 2)) - (px - w / 2);
    pe.style.transform = 'translate3d(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px,0)'; card.style.setProperty('--dx', dx.toFixed(1) + 'px'); pe.style.opacity = 1; pe.style.pointerEvents = '';
  });
  if (!shown && t > .4) { shown = true; document.getElementById('load').classList.add('off'); setTimeout(size, 50); }
}
setTimeout(function(){ document.getElementById('load').classList.add('off'); }, 2500);
frame();
})();
